name: Build Cascade Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Install WiX
      run: dotnet tool install --global wix --version 6.0.2
    
    - name: Restore dependencies
      run: dotnet restore CascadeWindows/CascadeWindows.csproj
    
    - name: Build and publish application
      run: dotnet publish CascadeWindows/CascadeWindows.csproj -c Release -r win-x64 --self-contained false
    
    - name: Build installer
      run: dotnet build Installer/Installer.wixproj -c Release
    
    - name: Upload application artifact
      uses: actions/upload-artifact@v4
      with:
        name: CascadeWindows-Executable
        path: CascadeWindows/bin/Release/net8.0-windows/win-x64/CascadeWindows.exe
    
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: CascadeWindows-Installer
        path: Installer/bin/x64/Release/CascadeWindowsSetup.msi
